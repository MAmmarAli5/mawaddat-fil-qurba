<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Student Login | مودّت فی القربیٰ
</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    font-family:"Inter",sans-serif;

    background:#f8f8f5;

}


.login-page{

    min-height:100vh;

    display:flex;

}


/* LEFT */

.login-visual{

    width:50%;

    background:
    linear-gradient(
        145deg,
        #07382f,
        #0d4b3e
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:50px;

    text-align:center;

}


.visual-content{

    max-width:450px;

}


.logo-circle{

    width:100px;

    height:100px;

    border-radius:50%;

    border:1px solid #e1c45c;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:auto;

    font-family:"Amiri";

    font-size:55px;

    color:#e1c45c;

}


.login-visual h1{

    margin-top:30px;

    font-family:"Amiri";

    font-size:42px;

}


.login-visual span{

    display:block;

    color:#e1c45c;

}


.login-visual p{

    margin-top:20px;

    color:rgba(255,255,255,.7);

    line-height:2;

    font-size:14px;

}



/* RIGHT */

.login-box{

    width:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

}


.card{

    width:min(420px,100%);

}


.heading span{

    color:#c9a227;

    font-size:11px;

    font-weight:800;

}


.heading h2{

    margin-top:10px;

    font-size:35px;

    color:#202522;

}


.heading p{

    margin-top:10px;

    color:#69736f;

    font-size:13px;

}



.form{

    margin-top:30px;

    display:grid;

    gap:18px;

}



.input-box{

    position:relative;

}



.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#7c8782;

}


input{

    width:100%;

    height:52px;

    border-radius:12px;

    border:1px solid #ddd;

    padding-left:45px;

    font-size:14px;

    outline:none;

}


input:focus{

    border-color:#0d4b3e;

}



.password-toggle{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    cursor:pointer;

}



button{

    height:52px;

    border:none;

    border-radius:12px;

    background:#c9a227;

    color:#07382f;

    font-weight:800;

    cursor:pointer;

}


button:hover{

    background:#e1c45c;

}



.message{

    display:none;

    padding:12px;

    border-radius:10px;

    font-size:12px;

}



.message.show{

    display:block;

}



.success{

    background:#e9f7ef;

    color:#126044;

}



.error{

    background:#fff0f1;

    color:#8b2635;

}



.footer{

    margin-top:25px;

    text-align:center;

    font-size:12px;

    color:#69736f;

}


.footer a{

    color:#0d4b3e;

    font-weight:bold;

}



@media(max-width:800px){

.login-page{

    flex-direction:column;

}


.login-visual,
.login-box{

    width:100%;

}


.login-visual{

    min-height:350px;

}


}



</style>

</head>


<body>


<div class="login-page">


<section class="login-visual">


<div class="visual-content">


<div class="logo-circle">
؏
</div>


<h1>

مودّت فی القربیٰ

<span>
Student Portal
</span>

</h1>


<p>

Access your courses, examinations and results through our Islamic learning platform.

</p>


</div>


</section>



<section class="login-box">


<div class="card">


<div class="heading">


<span>
STUDENT LOGIN
</span>


<h2>
Welcome Back
</h2>


<p>
Login to continue your learning journey.
</p>


</div>



<div id="message"
class="message">

</div>



<form id="loginForm"
class="form">


<div class="input-box">


<i class="fa-solid fa-envelope"></i>


<input
id="email"
type="email"
placeholder="Email address"
required>


</div>



<div class="input-box">


<i class="fa-solid fa-lock"></i>


<input
id="password"
type="password"
placeholder="Password"
required>



<button
type="button"
class="password-toggle"
id="togglePassword">

<i class="fa-solid fa-eye"></i>

</button>


</div>



<button
id="loginBtn"
type="submit">

Login To Dashboard

</button>


</form>



<div class="footer">


Don't have an account?


<a href="register.html">
Register Now
</a>


<br><br>


<a href="../index.html">
← Back Home
</a>


</div>


</div>


</section>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>



<script>


const form =
document.getElementById("loginForm");


const message =
document.getElementById("message");


const btn =
document.getElementById("loginBtn");



function showMessage(text,type){

message.textContent=text;

message.className=
"message show "+type;

}



document
.getElementById("togglePassword")
.addEventListener("click",()=>{


const pass =
document.getElementById("password");


const icon =
document.querySelector("#togglePassword i");


if(pass.type==="password"){

pass.type="text";

icon.classList.replace(
"fa-eye",
"fa-eye-slash"
);


}else{


pass.type="password";


icon.classList.replace(
"fa-eye-slash",
"fa-eye"
);


}


});





form.addEventListener(
"submit",
async(e)=>{


e.preventDefault();



btn.disabled=true;

btn.innerText="Logging in...";



const email =
document.getElementById("email")
.value.trim();



const password =
document.getElementById("password")
.value;



try{


const {

data,
error

} =
await supabaseClient.auth
.signInWithPassword({

email,
password

});



if(error){

throw error;

}



showMessage(
"Login successful! Opening dashboard...",
"success"
);



setTimeout(()=>{


window.location.href=
"dashboard.html";


},1500);



}

catch(error){


showMessage(
error.message,
"error"
);


btn.disabled=false;

btn.innerText=
"Login To Dashboard";


}


});


</script>


</body>

</html>
