<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exam Result | Mawaddat Fil Qurba</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f7f7f2;
    margin:0;
    padding:0;
}

.container{
    width:90%;
    max-width:600px;
    margin:50px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-align:center;
}

h1{
    color:#07382f;
}

.result-box{
    margin-top:25px;
    background:#f1f3ed;
    padding:20px;
    border-radius:15px;
}

.item{
    font-size:18px;
    margin:12px;
    font-weight:bold;
}

.pending{
    color:#8b1e2d;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">

<div class="card">

<h1>
Mawaddat Fil Qurba
</h1>


<h2 id="title">
Exam Result
</h2>


<div id="loading">
Loading Result...
</div>


<div id="result" style="display:none;">

<div class="result-box">

<div class="item">
Score:
<span id="score"></span>
</div>


<div class="item">
Total Marks:
<span id="total"></span>
</div>


<div class="item">
Percentage:
<span id="percentage"></span>%
</div>


<div class="item">
Position:
<span id="position">
Will be announced
</span>
</div>


</div>

</div>



<div id="pending" style="display:none;">

<p class="pending">

Your result is not published yet.

<br><br>

Your result will be available after the scheduled publication time.

</p>

</div>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>



<script>


async function loadResult(){


const {
data:{user}
}=await supabaseClient.auth.getUser();



if(!user){

window.location.href="login.html";
return;

}



const {
data,
error
}=await supabaseClient
.from("results")
.select("*")
.eq("student_id",user.id)
.order("submitted_at",{ascending:false})
.limit(1)
.single();



if(error){

document.getElementById("loading").innerHTML=
"No result found.";

return;

}



document.getElementById("loading").style.display="none";



if(data.published !== true){


document.getElementById("pending")
.style.display="block";


return;

}



document.getElementById("result")
.style.display="block";



document.getElementById("score")
.innerText=data.score;


document.getElementById("total")
.innerText=data.total_marks;


document.getElementById("percentage")
.innerText=data.percentage;



}



loadResult();


</script>


</body>
</html>
